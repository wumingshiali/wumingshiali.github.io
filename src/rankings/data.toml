# ============================================================
# 排名数据（单一数据源）
# ------------------------------------------------------------
# 一个文件包含所有分类；每个 [[categories]] 是一个分类，
# 其下的 [[categories.items]] 是该分类里的排名条目。
#
# 字段说明：
# - id              : 分类唯一标识（URL 用，必填，仅小写字母/数字/连字符）
# - name            : 分类显示名（必填）
# - description     : 分类一句话描述（可选）
# - items[].name    : 条目名称（必填）
# - items[].brief   : 简洁描述（可选）
# - items[].comment : 评价（可选）
# - items[].score   : 分数 0-100（必填，决定等级展示：90 夯 / 80 顶级 / 70 人上人 / 60 NPC / 以下 拉完了）
#
# 想改排名？直接编辑本文件提交即可，无需本地构建。
# 也可以用 /tools/other/ranking 工具可视化编辑并生成 TOML。
# ============================================================

[[categories]]
id = "text-editor"
name = "文本编辑器"
description = "给各大文本编辑器排名"

  [[categories.items]]
  name = "Zed"
  brief = "Your last next editor"
  comment = "真的是最后一个编辑器"
  score = 100

  [[categories.items]]
  name = "VS code"
  brief = "The open source AI code editor"
  comment = "开源编辑器的先驱"
  score = 80

  [[categories.items]]
  name = "Vim"
  brief = "The ubiquitous text editor"
  comment = "记忆成本太高了"
  score = 40

  [[categories.items]]
  name = "Nano"
  brief = "一个轻量化的GNU编辑器"
