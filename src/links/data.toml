# ============================================================
# 友链数据（单一数据源）
# ------------------------------------------------------------
# 想添加友链？
# 1. fork 本仓库
# 2. 在下方 [[links]] 列表末尾追加你的站点信息
# 3. 提交 Pull Request（标题以 [友链] 开头）
# 4. 等待人工审核（自动检测通过后会通知站长）
#
# 字段说明：
# - name     : 显示名称（必填）
# - url      : 跳转链接（必填，需可正常访问）
# - priority : 排序优先级 high / default / low（可选，默认 default）
# - cover    : 封面图 URL（可选，缺省显示默认图标）
# ============================================================

[[links]]
name = "Acofork"
url = "https://acofork.com"
priority = "high"
cover = "https://www.acofork.com/favicon-192.png"

[[links]]
name = "Example 测试"
url = "https://example.com"
priority = "low"
cover = "https://example.com/example.png"
