media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 博客文章
    type: collection
    path: src/posts
    # 👇 只写目录名，不要带 /index.md
    filename: "{id}"
    view:
      layout: tree
      primary: id
      fields: [name, createTime]
      node:
        filename: index.md   # 👈 文件名在这里指定
        hideDirs: others
    fields:
      - name: id
        label: 文章 ID（文件夹名）
        type: string
        required: true
      - name: name
        label: 名字
        type: string
      - name: desc
        label: 描述
        type: text
      - name: tag
        label: 标签
        type: string
        list: true
      - name: createTime
        label: 创建时间
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: cover
        label: 封面
        type: image
        required: false
        options:
          extensions: [webp, jpg, png]
      - name: body
        label: 正文
        type: rich-text