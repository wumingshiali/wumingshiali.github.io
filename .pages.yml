media:
  input: public/images # 全局图片上传目录，建议放 public 下方便直接访问
  output: /images

content:
  - name: posts
    label: 博客文章
    type: collection
    path: src/posts
    # 关键配置：让 CMS 按文件夹组织，并在文件夹里生成 index.md
    view:
      layout: tree
      node:
        filename: index.md
    fields:
      - name: name
        label: 名字
        type: string
        primary: true # 让名字作为列表主标题，并默认用作 [id] 文件夹名 (slug)
      
      - name: desc
        label: 描述
        type: text
      
      - name: tag
        label: 标签
        type: string
        list: true # 加上 list: true，CMS 就会输出 ["标签 1", "标签 2"] 的数组
      
      - name: createTime
        label: 创建时间
        type: date
        options:
          format: "yyyy-MM-dd" # PagesCMS 用的是 date-fns 语法
      
      - name: cover
        label: 封面 (可选)
        type: image
        required: false
        options:
          extensions: [webp, jpg, png]