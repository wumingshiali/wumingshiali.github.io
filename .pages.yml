media:
  input: src/posts
  output: /src/posts

content:
  - name: posts
    label: 博客文章
    type: collection
    path: src/posts
    view:
      layout: tree
      primary: name
      fields: [name, createTime]
      node:
        filename: index.md
        hideDirs: others
    fields:
      - name: name
        label: 名字
        type: string
      - name: desc
        label: 描述
        type: text
      - name: tag
        label: 标签
        type: string
        list: true
      - name: createTime
        label: 创建时间
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: cover
        label: 封面
        type: image
        required: false
        options:
          extensions: [webp, jpg, png]
      # 👇 关键：加上这个才能编辑正文
      - name: body
        label: 正文
        type: rich-text