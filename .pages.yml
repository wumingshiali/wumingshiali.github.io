media:
  input: public/images
  output: /images

content:
  - name: posts
    label: 博客文章
    type: collection
    path: src/posts
    # 👇 用对象形式 + field: create，新建时弹出输入框
    filename:
      template: "{id}/index.md"
      field: create
    view:
      layout: tree
      primary: id
      fields: [name, createTime]
      node:
        filename: index.md
        hideDirs: others
    fields:
      - name: id
        label: 文章 ID（文件夹名）
        type: string
        required: true
      - name: name
        label: 名字
        type: string
      - name: desc
        label: 描述
        type: text
      - name: tag
        label: 标签
        type: string
        list: true
      - name: createTime
        label: 创建时间
        type: date
        options:
          format: "yyyy-MM-dd"
      - name: cover
        label: 封面
        type: image
        required: false
        options:
          extensions: [webp, jpg, png]
      - name: body
        label: 正文
        type: rich-text