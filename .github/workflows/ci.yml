name: CI

on:
  push:
    branches: [v3, main]
  pull_request:
    branches: [v3, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # webkit 是 mobile-iphone-se project 的浏览器引擎（iPhone SE 模拟用），
        # 不装的话该 project 5 个测试会全部因 "Executable doesn't exist" 红
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      # 预渲染数据文件必须在提交时与 src/posts 保持一致：
      # 构建会重新生成它，若与 HEAD 不一致或未提交则 CI 失败，防止静默漂移
      - name: Verify generated posts data is committed and in sync
        run: |
          git diff --exit-code -- src/generated/posts-data.ts
          if git status --porcelain -- src/generated/posts-data.ts | grep -q .; then
            echo "::error::src/generated/posts-data.ts 未提交或与构建结果不一致，请运行 pnpm build 后提交该文件"
            exit 1
          fi

      - name: Component tests
        run: pnpm run test:component

      - name: Build integrity
        run: pnpm run test:build

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Wrangler pages dev smoke
        run: pnpm run test:deploy

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

