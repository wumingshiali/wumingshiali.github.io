<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://fontsapi.zeoseven.com/66/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin>
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/66/main/result.css"></noscript>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./head.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukncat - 个人主页</title>
    <!-- DNS 预解析 -->
    <link rel="dns-prefetch" href="https://fontsapi.zeoseven.com">
    <link rel="dns-prefetch" href="https://umi.meali.top">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <!-- 预加载关键资源 -->
    <link rel="preload" href="./head.webp" as="image" type="image/webp">
    <!-- PWA 支持（可选） -->
    <meta name="theme-color" content="#000000">
    <!-- 预加载 Vue 和 motion-v -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/vue@3.5.17/dist/vue.esm-browser.prod.js">
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/motion-v@1.7.6/dist/index.mjs">
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.17/dist/vue.esm-browser.prod.js",
        "motion-v": "https://cdn.jsdelivr.net/npm/motion-v@1.7.6/dist/index.mjs"
      }
    }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
