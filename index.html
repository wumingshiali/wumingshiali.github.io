<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/avatar-52491de8.webp" />
    <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin />
    <link rel="dns-prefetch" href="https://fontsapi.zeoseven.com" />
    <link
      rel="preload"
      as="style"
      href="https://fontsapi.zeoseven.com/66/main/result.css"
      onload="this.rel = 'stylesheet'"
      crossorigin
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fontsapi.zeoseven.com/66/main/result.css"
        crossorigin
    /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoidCat - 个人主页</title>
    <script>
      // 首屏前同步设置主题，避免刷新闪烁（与 App.vue 的主题逻辑保持一致）
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
