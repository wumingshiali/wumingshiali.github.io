    <title>Ukncat - 个人主页</title>
    <!-- DNS 预解析 -->
    <link rel="dns-prefetch" href="https://fontsapi.zeoseven.com">
    <link rel="dns-prefetch" href="https://umi.meali.top">
    <link rel="dns-prefetch" href="https://s4.zstatic.net">
    <!-- 预加载关键资源 -->
    <link rel="preload" href="./head.webp" as="image" type="image/webp">
    <!-- PWA 支持（可选） -->
    <meta name="theme-color" content="#000000">

    <link rel="modulepreload" href="https://s4.zstatic.net/npm/motion-dom@12.38.0/dist/es/index.mjs" integrity="sha256-BXJcL9sos7GUARXf3RC6XAEyHTvg1l3Batzi+a9l7Zs=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://s4.zstatic.net/npm/motion-utils@12.36.0/dist/es/index.mjs" integrity="sha256-Li7KDS6ADJvoue6/M2wMQ9XvL8tFaK7fH3A3WYNQ6+c=" crossorigin="anonymous">

    <link rel="modulepreload" href="https://s4.zstatic.net/npm/hey-listen@1.0.8/dist/hey-listen.es.js" integrity="sha256-PGuHjduU/75eZWFBPifNJnHv4LA8D5gobqjLgYIw7yk=" crossorigin="anonymous">
    <link rel="modulepreload" href="https://s4.zstatic.net/npm/@vueuse/shared@14.2.1/dist/index.js" integrity="sha256-Xv8xAHP2A4xrUE/eZMuCOslArG7O5qMQQ9NxbDqq7Tg=" crossorigin="anonymous">
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
    {
      "imports": {
        "vue": "https://s4.zstatic.net/ajax/libs/vue/3.5.22/vue.esm-browser.prod.min.js",
        "motion-v": "https://s4.zstatic.net/npm/motion-v@1.7.6/dist/es/index.mjs",
        "motion-dom": "https://s4.zstatic.net/npm/motion-dom@12.38.0/dist/es/index.mjs",
        "motion-utils": "https://s4.zstatic.net/npm/motion-utils@12.36.0/dist/es/index.mjs",
        "framer-motion": "https://s4.zstatic.net/npm/framer-motion@12.38.0/dist/es/index.mjs",
        "@vueuse/core": "https://s4.zstatic.net/npm/@vueuse/core@14.2.1/dist/index.js",
        "hey-listen": "https://s4.zstatic.net/npm/hey-listen@1.0.8/dist/hey-listen.es.js",
        "@vueuse/shared": "https://s4.zstatic.net/npm/@vueuse/shared@14.2.1/dist/index.js"
      }
    }
    </script>
    <script type="module">
      if (typeof window !== 'undefined' && typeof process === 'undefined') {
        window.process = { env: { NODE_ENV: 'production' } }
      }
    </script>
    <script type="module">
  // 监听模块加载失败（原生 ESM 唯一可靠方式）
  window.addEventListener('error', (e) => {
    if (e.target?.tagName === 'SCRIPT' && e.target?.src?.includes('s4.zstatic.net')) {
      document.body.innerHTML = '<h1 style="color:#f56c6c">依赖加载失败，请检查网络</h1>';
    }
  }, true); // 捕获阶段，确保能监听到 module 脚本错误
</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
